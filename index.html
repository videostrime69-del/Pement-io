<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સરળ પેમેન્ટ</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Hind+Vadodara:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.12) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', 'Hind Vadodara', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Header Style */
        .header {
            text-align: center;
            margin-bottom: 6px;
            animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 40%, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 16px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Big Action Cards */
        .pay-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 110px;
            padding: 0 30px;
            border-radius: 30px;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .pay-card:nth-child(1) { animation-delay: 0.1s; }
        .pay-card:nth-child(2) { animation-delay: 0.2s; }
        .pay-card:nth-child(3) { animation-delay: 0.3s; }

        /* Smooth Press Response */
        .pay-card:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* 1. FamPay Theme (Amber/Gold) */
        .card-fampay {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(217, 119, 6, 0.05));
            border-color: rgba(245, 158, 11, 0.35);
            box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.25);
        }

        /* 2. Indian Post Theme (Crimson Red) */
        .card-post {
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.22), rgba(190, 18, 60, 0.05));
            border-color: rgba(225, 29, 72, 0.35);
            box-shadow: 0 20px 40px -10px rgba(225, 29, 72, 0.25);
        }

        /* 3. Google Pay Theme (Electric Blue) */
        .card-gpay {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(29, 78, 216, 0.05));
            border-color: rgba(37, 99, 235, 0.35);
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.25);
        }

        /* Text Title */
        .card-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        /* Forward Arrow Circle */
        .arrow-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .arrow-circle svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pay-card:active .arrow-circle {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Keyframe Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title Header -->
        <div class="header">
            <h1>પૈસા મોકલો</h1>
            <p>નામ પર ક્લિક કરો</p>
        </div>

        <!-- 1. FamPay (Top) -->
        <a href="upi://pay?pa=9173456004@fam&pn=Chintan&cu=INR" class="pay-card card-fampay">
            <span class="card-title">Fam Pay</span>
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </a>

        <!-- 2. Indian Post (Middle) -->
        <a href="upi://pay?pa=limbachiya660@naviaxis&pn=Chintan&cu=INR" class="pay-card card-post">
            <span class="card-title">Indian Post</span>
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </a>

        <!-- 3. Google Pay (Bottom) -->
        <a href="upi://pay?pa=chintanlimbachiya491@oksbi&pn=Chintan&cu=INR" class="pay-card card-gpay">
            <span class="card-title">Google Pay</span>
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </a>
    </div>

</body>
</html>
